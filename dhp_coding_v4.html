<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DHP Coding v4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#f6f5f2; --surface:#ffffff; --sunk:#eeece7;
  --ink:#191b1e; --ink-2:#4a5058; --ink-3:#767d86;
  --rule:#d9d5ce; --rule-2:#ebe8e2;
  --accent:#b3211c; --steel:#46586a; --ok:#1d7048; --ok-bg:#e6f2ea;
  --warn:#8a5a08; --warn-bg:#faf0dc; --bad-bg:#fbe9e7;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --sans:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --disp:"Archivo","IBM Plex Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121316; --surface:#191b1f; --sunk:#202329;
  --ink:#e9e7e3; --ink-2:#adb4bd; --ink-3:#7d858f;
  --rule:#2f343b; --rule-2:#25292f;
  --accent:#f0655a; --steel:#9fb6cb; --ok:#5fc08d; --ok-bg:#17281f;
  --warn:#d9a441; --warn-bg:#2a2317; --bad-bg:#33201e;
}}
:root[data-theme="dark"]{
  --paper:#121316; --surface:#191b1f; --sunk:#202329;
  --ink:#e9e7e3; --ink-2:#adb4bd; --ink-3:#7d858f;
  --rule:#2f343b; --rule-2:#25292f;
  --accent:#f0655a; --steel:#9fb6cb; --ok:#5fc08d; --ok-bg:#17281f;
  --warn:#d9a441; --warn-bg:#2a2317; --bad-bg:#33201e;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.55}
h1,h2,h3{font-family:var(--disp);margin:0}
button,input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
.mono{font-family:var(--mono)}
.top{background:var(--surface);border-bottom:2px solid var(--ink);padding:10px 20px;
     display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.brand{display:flex;flex-direction:column;gap:1px}
.brand b{font-family:var(--disp);font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:10.5px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
.spacer{flex:1}
.badge{font-family:var(--mono);font-size:11.5px;padding:4px 10px;border:1px solid var(--rule);background:var(--sunk)}
.badge.dirty{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.badge.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.btn{background:var(--surface);border:1px solid var(--rule);padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.lang{display:flex;border:1px solid var(--rule)}
.lang button{border:0;background:none;padding:5px 10px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-3)}
.lang button.on{background:var(--ink);color:var(--paper)}
.tabs{background:var(--surface);border-bottom:1px solid var(--rule);padding:0 14px;display:flex;gap:2px;
      overflow-x:auto;position:sticky;top:53px;z-index:19}
.tab{padding:9px 14px;border:0;background:none;cursor:pointer;color:var(--ink-2);white-space:nowrap;
     border-bottom:2px solid transparent;font-size:13.5px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.page{max-width:1180px;margin:0 auto;padding:22px 20px 80px}
.view{display:none}.view.on{display:block}
h2.h{font-size:18px;font-weight:600;margin-bottom:4px}
p.sub{color:var(--ink-2);font-size:13.5px;max-width:72ch;margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--rule);padding:18px 20px;margin-bottom:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:11px;letter-spacing:.09em;
        text-transform:uppercase;color:var(--ink-3);font-weight:500}
label.f select,label.f input,label.f textarea{padding:7px 9px;border:1px solid var(--rule);background:var(--surface);
        text-transform:none;letter-spacing:0;font-size:14px;width:100%}
label.f textarea{min-height:60px;resize:vertical}
.preview{background:var(--sunk);border:1px solid var(--rule);padding:20px;text-align:center;margin-bottom:16px}
.preview .code{font-family:var(--mono);font-size:clamp(20px,4vw,34px);font-weight:600;letter-spacing:.02em;word-break:break-all}
.preview .code .g{color:var(--ink-3)}
.preview .exp{font-size:13.5px;color:var(--ink-2);margin-top:10px;min-height:20px}
.preview .st{margin-top:10px;font-family:var(--mono);font-size:12px}
.st.ok{color:var(--ok)}.st.bad{color:var(--accent)}
.tbox{overflow:auto;border:1px solid var(--rule);background:var(--surface);max-height:60vh}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{position:sticky;top:0;background:var(--sunk);text-align:left;padding:8px 11px;font-size:10.5px;
   letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:500;
   border-bottom:1px solid var(--rule);white-space:nowrap;z-index:2}
td{padding:6px 11px;border-bottom:1px solid var(--rule-2);vertical-align:top}
tr:hover td{background:var(--sunk)}
td.c{font-family:var(--mono);white-space:nowrap;font-weight:600}
td.mono{font-family:var(--mono);white-space:nowrap}
td.num{text-align:right;font-family:var(--mono)}
td input,td select{width:100%;padding:3px 5px;border:1px solid var(--rule-2);background:transparent}
td input:focus,td select:focus{background:var(--surface);border-color:var(--rule)}
.pill{display:inline-block;padding:1px 7px;font-size:11px;border:1px solid;border-radius:9px;font-family:var(--sans)}
.p-cao{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.p-vua{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.p-thap{background:var(--bad-bg);border-color:var(--accent);color:var(--accent)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input[type=text]{padding:6px 10px;border:1px solid var(--rule);background:var(--surface);min-width:200px}
.toolbar select{padding:6px 9px;border:1px solid var(--rule);background:var(--surface)}
.count{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.hint{font-size:12.5px;color:var(--ink-3);margin-top:8px}
.note-box{border-left:3px solid var(--accent);background:var(--surface);padding:12px 16px;margin:16px 0;font-size:13.5px;color:var(--ink-2)}
.empty{padding:26px;text-align:center;color:var(--ink-3);font-size:13.5px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--rule);
     border:1px solid var(--rule);margin-bottom:18px}
.kpi>div{background:var(--surface);padding:13px 15px}
.kpi b{display:block;font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.2}
.kpi span{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
@media(max-width:860px){.g3,.g4{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}.tabs{top:76px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="top">
  <div class="brand"><b>DHP Coding v4</b><span data-i="tagline"></span></div>
  <span class="spacer"></span>
  <span class="badge" id="stat">—</span>
  <div class="lang"><button id="lvi" onclick="setLang('vi')">VI</button><button id="len" onclick="setLang('en')">EN</button></div>
  <button class="btn" onclick="doExport()" data-i="btnExport"></button>
  <button class="btn" onclick="$('imp').click()" data-i="btnImport"></button>
  <input type="file" id="imp" accept=".json" style="display:none" onchange="doImport(this)">
  <button class="btn" onclick="toggleTheme()" title="Light / dark">◐</button>
</div>

<div class="tabs" id="tabs"></div>
<div class="page">

<!-- SINH MÃ -->
<div class="view on" id="v-build">
  <h2 class="h" data-i="buildH"></h2>
  <p class="sub" data-i="buildS"></p>
  <div class="preview">
    <div class="code" id="pvCode">— — — —</div>
    <div class="exp" id="pvExp"></div>
    <div class="st" id="pvSt"></div>
  </div>
  <div class="card">
    <div class="grid g3">
      <label class="f"><span data-i="fRole"></span><select id="b_role" onchange="upd()"></select></label>
      <label class="f"><span data-i="fCls"></span><select id="b_cls" onchange="famList();upd()"></select></label>
      <label class="f"><span data-i="fFam"></span><select id="b_fam" onchange="upd()"></select></label>
      <label class="f"><span data-i="fBrand"></span><select id="b_brand" onchange="serList();upd()"></select></label>
      <label class="f"><span data-i="fSer"></span><select id="b_ser" onchange="upd()"></select></label>
      <label class="f"><span data-i="fSize"></span><input id="b_size" placeholder="42" oninput="upd()"></label>
    </div>
    <div class="grid g4" style="margin-top:14px">
      <label class="f"><span data-i="fChild"></span><select id="b_child" onchange="upd()"></select></label>
      <label class="f"><span data-i="fVar"></span><input id="b_var" placeholder="048 · 92A" oninput="upd()"></label>
      <label class="f"><span data-i="fRev"></span><input id="b_rev" placeholder="R1A" oninput="upd()"></label>
      <label class="f"><span data-i="fStatus"></span><select id="b_status"></select></label>
    </div>
    <div class="grid g2" style="margin-top:14px">
      <label class="f"><span data-i="fName"></span><input id="b_name"></label>
      <label class="f"><span data-i="fAlias"></span><input id="b_alias" placeholder="0.KNL-JAW-KTR-ROTEX-042-D48"></label>
    </div>
    <div class="toolbar" style="margin:16px 0 0">
      <button class="btn pri" onclick="addSku()" data-i="btnAdd"></button>
      <button class="btn" onclick="clearBuild()" data-i="btnClear"></button>
      <span class="hint" id="b_hint"></span>
    </div>
  </div>
  <div class="note-box" id="varHint"></div>
</div>

<!-- THƯ VIỆN -->
<div class="view" id="v-lib">
  <h2 class="h" data-i="libH"></h2>
  <p class="sub" data-i="libS"></p>
  <div class="kpi" id="libKpi"></div>
  <div class="toolbar">
    <input type="text" id="q" oninput="renderLib()">
    <select id="fCls" onchange="renderLib()"></select>
    <select id="fBrand" onchange="renderLib()"></select>
    <button class="btn" onclick="exportCsv()" data-i="btnCsv"></button>
    <span class="count" id="libCount"></span>
  </div>
  <div class="tbox"><table><thead><tr id="libHead"></tr></thead><tbody id="libBody"></tbody></table></div>
</div>

<!-- GIẢI MÃ -->
<div class="view" id="v-dec">
  <h2 class="h" data-i="decH"></h2>
  <p class="sub" data-i="decS"></p>
  <div class="card">
    <label class="f"><span data-i="fDec"></span><input id="decIn" placeholder="01JW-KTR-ROTX-0042-E/92A" oninput="decode()" style="font-family:var(--mono);font-size:17px"></label>
    <div class="toolbar" style="margin-top:12px">
      <button class="btn sm" onclick="decSample('01JW-KTR-ROTX-0042-E/92A')" data-i="exPart"></button>
      <button class="btn sm" onclick="decSample('81UJ-DHP-EPEP-0001')" data-i="exAsm"></button>
      <button class="btn sm" onclick="decSample('DP26014-ASB-01')" data-i="exDoc"></button>
    </div>
  </div>
  <div id="decOut"></div>
</div>

<!-- CỤM LẮP -->
<div class="view" id="v-asm">
  <h2 class="h" data-i="asmH"></h2>
  <p class="sub" data-i="asmS"></p>
  <div class="card">
    <div class="grid g4">
      <label class="f"><span data-i="fKey"></span><input id="a_key" maxlength="4" placeholder="EPEP" oninput="this.value=this.value.toUpperCase();updAsm()"></label>
      <label class="f"><span data-i="fSeq"></span><input id="a_seq" placeholder="0001" oninput="updAsm()"></label>
      <label class="f"><span data-i="fAsmName"></span><input id="a_name"></label>
      <label class="f"><span data-i="fProj"></span><input id="a_proj" placeholder="DP26014"></label>
    </div>
    <div style="margin-top:16px">
      <div class="toolbar">
        <select id="a_pick" style="min-width:320px"></select>
        <input type="text" id="a_qty" value="1" style="width:70px;padding:6px 8px;border:1px solid var(--rule);background:var(--surface)">
        <button class="btn" onclick="addBom()" data-i="btnBom"></button>
      </div>
      <div class="tbox" style="max-height:38vh"><table><thead><tr id="bomHead"></tr></thead><tbody id="bomBody"></tbody></table></div>
    </div>
    <div class="preview" style="margin-top:16px">
      <div class="code" id="aCode">— — — —</div>
      <div class="exp" id="aExp"></div>
    </div>
    <button class="btn pri" onclick="addAsm()" data-i="btnSaveAsm"></button>
  </div>
  <div class="tbox"><table><thead><tr id="asmHead"></tr></thead><tbody id="asmBody"></tbody></table></div>
</div>

<!-- DỰ ÁN -->
<div class="view" id="v-proj">
  <h2 class="h" data-i="projH"></h2>
  <p class="sub" data-i="projS"></p>
  <div class="card">
    <div class="grid g4">
      <label class="f"><span data-i="fEnt"></span><select id="p_ent"><option value="D">D — Đại Hồng Phát</option></select></label>
      <label class="f"><span data-i="fJob"></span><select id="p_type" onchange="updProj()"></select></label>
      <label class="f"><span data-i="fYear"></span><input id="p_year" value="26" maxlength="2" oninput="updProj()"></label>
      <label class="f"><span data-i="fPSeq"></span><input id="p_seq" maxlength="3" oninput="updProj()"></label>
    </div>
    <div class="grid g2" style="margin-top:14px">
      <label class="f"><span data-i="fPName"></span><input id="p_name" placeholder="An Viên — Narime"></label>
      <label class="f"><span data-i="fClient"></span><input id="p_client" placeholder="Narime"></label>
    </div>
    <div class="preview" style="margin-top:16px"><div class="code" id="pCode">DP26001</div><div class="exp" id="pExp"></div></div>
    <button class="btn pri" onclick="addProj()" data-i="btnAddProj"></button>
  </div>
  <div class="tbox"><table><thead><tr id="projHead"></tr></thead><tbody id="projBody"></tbody></table></div>
  <div class="note-box" data-i="projNote"></div>
</div>

<!-- DANH MỤC -->
<div class="view" id="v-cat">
  <h2 class="h" data-i="catH"></h2>
  <p class="sub" data-i="catS"></p>
  <div class="kpi" id="catKpi"></div>
  <div class="toolbar">
    <input type="text" id="cq" oninput="renderSeries()">
    <select id="cBrand" onchange="renderSeries()"></select>
    <select id="cConf" onchange="renderSeries()"></select>
    <span class="count" id="catCount"></span>
  </div>
  <div class="tbox"><table><thead><tr id="serHead"></tr></thead><tbody id="serBody"></tbody></table></div>
  <div class="note-box" data-i="catNote"></div>
</div>

<!-- CHUYỂN MÃ CŨ -->
<div class="view" id="v-mig">
  <h2 class="h" data-i="migH"></h2>
  <p class="sub" data-i="migS"></p>
  <div class="card" style="padding-bottom:14px">
    <div class="toolbar" style="margin-bottom:6px">
      <button class="btn pri" onclick="$('csvIn').click()" data-i="btnCsvIn"></button>
      <input type="file" id="csvIn" accept=".csv,text/csv" style="display:none" onchange="runMigCsv(this)">
      <span class="hint" data-i="csvHint" style="margin:0"></span>
    </div>
  </div>
  <div class="card">
    <label class="f"><span data-i="fOld"></span><textarea id="migIn" style="min-height:120px;font-family:var(--mono)">0.KNB-WST-7
0.KNB-JAC-12
4.KNL-DHP-320
1.PLY-TPB-DHP-3535
CK368-DSC-N90-Z
RfN-7005-120x165</textarea></label>
    <div class="toolbar" style="margin-top:12px">
      <button class="btn pri" onclick="runMig()" data-i="btnMig"></button>
      <span class="hint" data-i="migHint"></span>
    </div>
  </div>
  <div id="migOut"></div>
</div>

</div>

/* ---------- tiện ích ---------- */
function opt(sel,arr,val,ph){sel.innerHTML=(ph?`<option value="">${ph}</option>`:"")+
  arr.map(a=>`<option value="${a[0]}">${a[0]?a[0]+" — ":""}${a[1]}</option>`).join("");
  if(val!==undefined)sel.value=val;}
function esc(s){return(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function pad(v,n){v=String(v||"").replace(/[^0-9]/g,"");return v?v.padStart(n,"0").slice(-n):""}
function nm(list,code){const f=list.find(x=>x[0]===code);return f?(f[li()]||f[1]):code}
function brandName(c){const b=DB.brands.find(x=>x.code===c);return b?b.name:c}
function head(id,cols){$(id).innerHTML=cols.map(c=>`<th>${esc(c)}</th>`).join("")}
function toggleTheme(){const r=document.documentElement;
  const cur=r.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
  r.setAttribute("data-theme",cur==="dark"?"light":"dark");}

/* ---------- sinh mã ---------- */
function famList(){opt($("b_fam"),(FAMS[$("b_cls").value]||[]).map(f=>[f[0],f[li()]]),undefined,"—")}
function serList(){const b=$("b_brand").value;
  const list=DB.series.filter(s=>s.brand===b).sort((a,c)=>a.name.localeCompare(c.name));
  opt($("b_ser"),list.map(s=>[s.code,s.name]),undefined,"—");}
function curCode(){
  const r=$("b_role").value,c=$("b_cls").value,f=$("b_fam").value,b=$("b_brand").value,
        s=$("b_ser").value,z=pad($("b_size").value,4);
  if(!(r&&c&&f&&b&&s&&z))return null;
  let code=`${r}${c}${f}-${b}-${s}-${z}`;
  const ch=$("b_child").value,v=($("b_var").value||"").toUpperCase().trim(),rev=($("b_rev").value||"").toUpperCase().trim();
  if(ch)code+="-"+ch; if(ch&&v)code+="/"+v; if(rev)code+="."+rev;
  return code;}
function upd(){
  const code=curCode(),ch=$("b_child").value;
  $("varHint").innerHTML=ch&&VARMEAN[ch]?fmt(t("varWith"),{c:ch,m:VARMEAN[ch][li()-1]}):t("varDefault");
  if(!code){$("pvCode").textContent="— — — —";$("pvExp").textContent=t("pvEmpty");$("pvSt").textContent="";return}
  $("pvCode").innerHTML=esc(code).replace(/-/g,'<span class="g">-</span>');
  $("pvExp").textContent=[nm(ROLES,$("b_role").value),nm(CLASSES,$("b_cls").value),
    nm(FAMS[$("b_cls").value]||[],$("b_fam").value),brandName($("b_brand").value),
    $("b_ser").selectedOptions[0].textContent.replace(/^.*— /,""),
    t("dSize")+" "+pad($("b_size").value,4)].join(" · ");
  const st=$("pvSt"),dup=DB.skus.some(s=>s.code===code);
  st.className=dup?"st bad":"st ok"; st.textContent=dup?t("pvDup"):t("pvOk");}
function addSku(){
  const code=curCode();
  if(!code){$("b_hint").textContent=t("needBlocks");return}
  if(DB.skus.some(s=>s.code===code)){$("b_hint").textContent=t("exists");return}
  DB.skus.push({code,role:$("b_role").value,cls:$("b_cls").value,fam:$("b_fam").value,brand:$("b_brand").value,
    ser:$("b_ser").value,size:pad($("b_size").value,4),child:$("b_child").value,
    vari:($("b_var").value||"").toUpperCase().trim(),rev:($("b_rev").value||"").toUpperCase().trim(),
    name:$("b_name").value.trim(),alias:$("b_alias").value.trim(),status:$("b_status").value,
    created:new Date().toISOString().slice(0,10)});
  save();$("b_hint").textContent=t("added")+code;upd();fillAsmPick();}
function clearBuild(){["b_size","b_var","b_rev","b_name","b_alias"].forEach(i=>$(i).value="");
  $("b_child").value="";upd();$("b_hint").textContent="";}

function exportCsv(){

/* ---------- giải mã ---------- */
const RE_SKU=/^([0-9])([1-9])([A-Z]{2})-([A-Z0-9]{3})-([A-Z0-9]{2,4})-([0-9]{1,4})(?:-([A-Z]))?(?:\/([A-Z0-9]{2,3}))?(?:\.([A-Z0-9]{2,4}))?$/;
const RE_PROJ=/^([A-Z])([A-Z])([0-9]{2})([0-9]{3})(?:-([A-Z]{3})-([0-9]{1,2}))?$/;
function decSample(s){$("decIn").value=s;decode()}
function tbl(v,rows,foot){return `<div class="card"><div style="font-family:var(--mono);font-size:22px;font-weight:600;margin-bottom:14px">${esc(v)}</div>
  <div class="tbox" style="max-height:none"><table><thead><tr>${t("decCols").map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>
  ${rows.map(x=>`<tr><td>${esc(x[0])}</td><td class="c">${esc(x[1])}</td><td>${esc(x[2])}</td></tr>`).join("")}
  </tbody></table></div>${foot?`<div class="hint">${foot}</div>`:""}</div>`;}
function decode(){
  const v=($("decIn").value||"").trim().toUpperCase(),out=$("decOut");
  if(!v){out.innerHTML="";return}
  let m=v.match(RE_SKU);
  if(m){const[,r,c,f,b,s,z,ch,va,rev]=m;
    const rows=[[t("dRole"),r,nm(ROLES,r)],[t("dCls"),c,nm(CLASSES,c)],[t("dFam"),f,nm(FAMS[c]||[],f)],
      [t("dBrand"),b,brandName(b)],[t("dSer"),s,(DB.series.find(x=>x.code===s&&x.brand===b)||{}).name||t("dNoSer")],
      [t("dSize"),z,t("dSizeN")+parseInt(z,10)]];
    if(ch)rows.push([t("dChild"),ch,nm(CHILD,ch)]);
    if(va)rows.push([t("dVar"),va,(VARMEAN[ch]?VARMEAN[ch][li()-1]:t("dVar"))+" = "+va]);
    if(rev)rows.push([t("dRev"),rev,"revision"]);
    const k=DB.skus.find(x=>x.code===v);
    out.innerHTML=tbl(v,rows,k?esc(t("decKnown")+(k.name||"—")):t("decUnknown"));return}
  m=v.match(RE_PROJ);
  if(m){const[,e,tp,y,q,dt,dn]=m;
    const rows=[[t("dEnt"),e,e==="D"?"Đại Hồng Phát":"—"],[t("dJob"),tp,nm(JOBTYPE,tp)],
      [t("dYear"),"20"+y,t("dIssue")],[t("dSeqN"),q,fmt(t("dProjN"),{n:parseInt(q,10)})]];
    if(dt)rows.push([t("dDocT"),dt,DOCTYPE.includes(dt)?t("dDocOk"):t("dDocBad")]);
    if(dn)rows.push([t("dDocN"),dn,fmt(t("dDocNv"),{n:parseInt(dn,10)})]);
    out.innerHTML=tbl(v,rows,"");return}
  out.innerHTML=`<div class="card">${t("decFail")}</div>`;}

/* ---------- cụm lắp ---------- */
let BOM=[];
function fillAsmPick(){const list=DB.skus.filter(s=>s.role!=="8");
  $("a_pick").innerHTML=list.length?list.map(s=>`<option value="${esc(s.code)}">${esc(s.code)} — ${esc(s.name||"")}</option>`).join("")
    :`<option value="">${t("noSku")}</option>`;}
function addBom(){const code=$("a_pick").value;if(!code)return;
  const s=DB.skus.find(x=>x.code===code);if(!s)return;
  BOM.push({code,fam:s.fam,name:s.name||"",qty:parseInt($("a_qty").value,10)||1});renderBom();updAsm();}
function renderBom(){$("bomBody").innerHTML=BOM.length?BOM.map((b,i)=>`<tr><td class="c">${esc(b.code)}</td>
  <td class="mono">${esc(b.fam)}</td><td>${esc(b.name)}</td><td class="num">${b.qty}</td>
  <td><button class="btn sm" onclick="BOM.splice(${i},1);renderBom();updAsm()">${t("del")}</button></td></tr>`).join("")
  :`<tr><td colspan="5" class="empty">${t("bomEmpty")}</td></tr>`;}
function asmFam(){const fams=BOM.map(b=>b.fam);
  for(const f of LADDER)if(fams.includes(f))return{fam:f,cls:"1"};
  if(fams.length){const b=DB.skus.find(x=>x.code===BOM[0].code);return{fam:b.fam,cls:b.cls}}
  return null;}
function updAsm(){
  const f=asmFam(),key=($("a_key").value||"").toUpperCase(),seq=pad($("a_seq").value,4);
  if(!f||!key||!seq){$("aCode").textContent="— — — —";
    $("aExp").textContent=BOM.length?t("asmNeedKey"):t("asmNeedBom");return}
  const code=`8${f.cls}${f.fam}-DHP-${key}-${seq}`;
  $("aCode").innerHTML=esc(code).replace(/-/g,'<span class="g">-</span>');
  $("aExp").textContent=fmt(t("asmWhy"),{f:f.fam,n:nm(FAMS[f.cls]||[],f.fam),r:LADDER.indexOf(f.fam)+1,c:BOM.length});}
function addAsm(){const f=asmFam(),key=($("a_key").value||"").toUpperCase(),seq=pad($("a_seq").value,4);
  if(!f||!key||!seq)return;
  const code=`8${f.cls}${f.fam}-DHP-${key}-${seq}`;
  if(DB.asm.some(a=>a.code===code)){alert(t("asmDup"));return}
  DB.asm.push({code,name:$("a_name").value.trim(),proj:$("a_proj").value.trim(),bom:BOM.slice()});
  BOM=[];renderBom();updAsm();save();renderAsm();}
function renderAsm(){fillAsmPick();
  $("asmBody").innerHTML=DB.asm.length?DB.asm.map((a,i)=>`<tr><td class="c">${esc(a.code)}</td>
    <td>${esc(a.name)}</td><td class="mono">${esc(a.proj)}</td><td class="num">${a.bom.length}</td>
    <td><button class="btn sm" onclick="DB.asm.splice(${i},1);save();renderAsm()">${t("del")}</button></td></tr>`).join("")
    :`<tr><td colspan="5" class="empty">${t("asmEmpty")}</td></tr>`;}

/* ---------- dự án ---------- */

  $("pCode").textContent=c;

function renderProj(){$("projBody").innerHTML=DB.proj.length?DB.proj.map((p,i)=>`<tr><td class="c">${esc(p.code)}</td>

/* ---------- danh mục ---------- */
function renderSeries(){
  const q=($("cq").value||"").toLowerCase(),fb=$("cBrand").value,fc=$("cConf").value;
  const rows=DB.series.filter(s=>(!fb||s.brand===fb)&&(!fc||s.conf===fc)&&
    (!q||(s.name+" "+s.brand+" "+s.code).toLowerCase().includes(q)));
  $("catCount").textContent=rows.length+" / "+DB.series.length;
  const n=c=>DB.series.filter(s=>s.conf===c).length;
  $("catKpi").innerHTML=[[t("kSerAll"),DB.series.length],[t("kOk"),n("cao")],[t("kMid"),n("vua")],
    [t("kLow"),n("thap")],[t("kBrands"),DB.brands.length]]
    .map(x=>`<div><b>${x[1]}</b><span>${x[0]}</span></div>`).join("");
  const lbl={cao:t("confOk"),vua:t("confMid"),thap:t("confLow")};
  $("serBody").innerHTML=rows.map(s=>{const i=DB.series.indexOf(s);
    return `<tr><td class="mono">${esc(s.brand)}</td><td>${esc(s.name)}</td>
      <td><input value="${esc(s.code)}" maxlength="4" style="font-family:var(--mono);text-transform:uppercase" onchange="setSer(${i},'code',this.value)"></td>
      <td><select onchange="setSer(${i},'cls',this.value)">${CLASSES.map(c=>`<option value="${c[0]}"${c[0]===s.cls?" selected":""}>${c[0]} ${c[li()]}</option>`).join("")}</select></td>
      <td><select onchange="setSer(${i},'fam',this.value)">${(FAMS[s.cls]||[]).map(f=>`<option value="${f[0]}"${f[0]===s.fam?" selected":""}>${f[0]} — ${f[li()].split(" — ")[0]}</option>`).join("")}</select></td>
      <td><span class="pill p-${s.conf}">${lbl[s.conf]}</span></td>
      <td class="num" title="${esc((s.exec||[]).slice(0,25).join(" · "))}">${(s.exec||[]).length||""}</td>
      <td class="mono" style="color:var(--ink-3);font-size:11.5px">${esc((s.alias||[])[0]||"")}</td></tr>`}).join("")
    ||`<tr><td colspan="8" class="empty">${t("noRow")}</td></tr>`;}
function setSer(i,k,v){DB.series[i][k]=(k==="code")?v.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,4):v;
  DB.series[i].conf="cao";save();renderSeries();}

/* ---------- chuyển mã cũ ---------- */
const OLDROLE={"0":1,"1":1,"3":1,"4":1,"8":1};
function guess(line){
  const raw=line.trim();if(!raw)return null;
  const r={old:raw,role:"",brand:"",size:"",ser:"",cls:"",fam:"",conf:0,why:[]};
  let s=raw.toUpperCase();
  const mp=s.match(/^([0-9])\./);
  if(mp&&OLDROLE[mp[1]]){r.role=mp[1];r.conf+=25;r.why.push(t("wRole"));s=s.slice(2)}
  else if(/^CK368/.test(s)){r.role="4";r.conf+=10;r.why.push(t("wCk"))}
  const alias={WST:["WST","WESTCAR"],KTR:["KTR"],RGF:["RGF","RINGFEDER","RFN"],JAC:["JAC"],
    FLD:["FLD","FLENDER"],DHP:["DHP","CK368"],MTN:["MTN","MARTIN"],CRM:["CRM","CROSS"],KBK:["KBK"]};
  for(const b of DB.brands.map(x=>x.code).filter(c=>c!=="OEM")){
    if((alias[b]||[b]).some(a=>s.includes(a))){r.brand=b;r.conf+=25;r.why.push(t("wBrand")+b);break}}
  const nums=s.match(/[1-9]\d{0,3}/g)||[];
  if(nums.length){r.size=pad(nums[nums.length-1],4);r.conf+=15;r.why.push(t("wSize"))}
  const hit=DB.series.find(x=>x.brand===r.brand&&s.includes(x.code));
  if(hit){r.ser=hit.code;r.cls=hit.cls;r.fam=hit.fam;r.conf+=25;r.why.push(t("wSer")+hit.name)}
  if(!r.cls){
    if(/KNL|DIA|DISC/.test(s)){r.cls="1";r.fam="DS";r.conf+=8;r.why.push(t("wkDisc"))}
    else if(/KNR|GEAR|RANG/.test(s)){r.cls="1";r.fam="GR";r.conf+=8;r.why.push(t("wkGear"))}
    else if(/KNB|BULONG|BU_LONG/.test(s)){r.cls="9";r.fam="FS";r.conf+=8;r.why.push(t("wkBolt"))}
    else if(/PLY|PULLEY|PULY/.test(s)){r.cls="3";r.fam="PU";r.conf+=8;r.why.push(t("wkPul"))}
    else if(/TPB|BUSH|CON/.test(s)){r.cls="2";r.fam="TB";r.conf+=8;r.why.push(t("wkBush"))}
    else if(/RFN|LOCK|KHOA/.test(s)){r.cls="2";r.fam="LD";r.conf+=8;r.why.push(t("wkLock"))}}
  return r;}
/* --- doc CSV app cu: SKU,MãCũ,Prefix,Tên,Hãng,Nhóm,Series,KíchThước,Bore,BiếnThể,... --- */
function noAcc(x){return String(x||"").replace(/đ/g,"d").replace(/Đ/g,"D")
  .normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"")}
function parseCsv(txt){
  txt=String(txt).replace(/^﻿/,"");
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){cell+='"';i++} else q=false } else cell+=c }
    else if(c==='"')q=true;
    else if(c===","){row.push(cell);cell=""}
    else if(c==="\n"){row.push(cell);cell="";rows.push(row);row=[]}
    else if(c!=="\r")cell+=c;}
  if(cell!==""||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(x=>String(x).trim()!==""));}
const NHOMMAP={khopnoirang:["1","GR"],khopnoidia:["1","DS"],khopnoidiadanhoi:["1","DS"],
 khopnoicardan:["1","UJ"],khopnoithuyluc:["1","FL"],khopnoicung:["1","RG"],khopnoixich:["1","CH"],
 khopnoibaovequatai:["1","TL"],khopnoilinhhoat:["1","JW"],caosugiamchan:["1","JW"],
 khopnoiservo:["1","BW"],khopnoiencoder:["1","BW"],khopnoidiengio:["1","DS"],
 khopnoiloxo:["1","GD"],khopnoiluoiloxo:["1","GD"],khopnoiluoithep:["1","GD"],
 khopnoibulongdaioc:["1","RG"],khopnoibanhxe:["1","RG"],khopkhoatruc:["2","LD"],
 thietbibooptruc:["2","SD"],pulyonglotcon:["3","PU"],xichnhongcongnghiep:["3","SP"],
 xichcongnghiep:["3","CN"],daycuroa:["3","BT"],phanhcongnghiep:["4","CA"],
 bolamatdauthuyluc:["5","OC"],phukienbomthuyluc:["5","PA"],vongbichongquaynguoc:["8","BS"]};
function guessRow(o){
  const r={old:String(o.sku||o.macu||"").trim()||"—",role:"",brand:"",size:"",ser:"",cls:"",fam:"",
           name:String(o.ten||"").trim(),conf:0,why:[]};
  const pfx=String(o.prefix||"").trim().charAt(0);
  if(/^[0-9]$/.test(pfx)){r.role=pfx;r.conf+=20;r.why.push(t("wPrefix"))}
  else{const m=String(o.sku||"").match(/^([0-9])\./); if(m){r.role=m[1];r.conf+=15;r.why.push(t("wRole"))}}
  const hb=noAcc(o.hang);
  if(hb){const b=DB.brands.find(x=>noAcc(x.name)===hb)
        ||DB.brands.find(x=>x.code!=="OEM"&&(hb.startsWith(noAcc(x.name))||noAcc(x.name).startsWith(hb)));
    if(b&&b.code!=="OEM"){r.brand=b.code;r.conf+=25;r.why.push(t("wHangCol")+" → "+b.code)}}
  if(!r.brand&&/ck368|dhp/.test(noAcc(o.sku)+noAcc(o.ten))){r.brand="DHP";r.conf+=10;r.why.push(t("wCk"))}
  const sn=noAcc(o.series);
  if(sn){const hit=DB.series.find(x=>noAcc(x.name)===sn&&(!r.brand||x.brand===r.brand))
              ||DB.series.find(x=>noAcc(x.name)===sn);
    if(hit){r.ser=hit.code;r.cls=hit.cls;r.fam=hit.fam;r.conf+=30;r.why.push(t("wSerCol")+" → "+hit.code)}}
  if(!r.cls){const g=NHOMMAP[noAcc(o.nhom)];
    if(g){r.cls=g[0];r.fam=g[1];r.conf+=10;r.why.push(t("wNhom"))}}
  const sz=String(o.kichthuoc||"").match(/[1-9]\d{0,3}/);
  if(sz){r.size=pad(sz[0],4);r.conf+=15;r.why.push(t("wSizeCol"))}
  else{const n=String(o.sku||"").match(/[1-9]\d{0,3}/g); if(n){r.size=pad(n[n.length-1],4);r.conf+=8;r.why.push(t("wSize"))}}
  const bo=String(o.bore||"").match(/\d{1,3}/);
  if(bo){r.why.push(t("wBore")+" "+bo[0])}
  return r;}
function runMigCsv(inp){
  const f=inp.files[0]; if(!f)return; const fr=new FileReader();
  fr.onload=()=>{try{
    const rows=parseCsv(fr.result); if(rows.length<2)throw 0;
    const H=rows[0].map(noAcc), idx={};
    const want={sku:["sku","masku","ma"],macu:["macu","oldcode"],prefix:["prefix","vaitro"],
      ten:["ten","tensanpham","name"],hang:["hang","brand"],nhom:["nhom","category","group"],
      series:["series"]};
    Object.keys(want).forEach(k=>{const i=H.findIndex(h=>want[k].indexOf(h)>=0); if(i>=0)idx[k]=i});
    if(idx.hang===undefined&&idx.series===undefined)throw 0;
    importCatalogue(rows.slice(1).map(rw=>{const o={};Object.keys(idx).forEach(k=>o[k]=rw[idx[k]]);return o}));
  }catch(e){alert(t("csvBad"))} };
  fr.readAsText(f,"UTF-8"); inp.value="";}
function importCatalogue(list){
  let a=0,b=0,c=0,d=0,e=0;
  const bByName={}; DB.brands.forEach(x=>bByName[noAcc(x.name)]=x.code);
  list.forEach(o=>{
    const serName=String(o.series||"").trim(), ten=String(o.ten||"").trim(), sku=String(o.sku||"").trim();
    const bc=bByName[noAcc(o.hang)]||"";
    // dong khong phai san pham: khong co series va ten trung ten hang
    if(!serName && (!bc || noAcc(ten)===noAcc(o.hang))){e++;return}
    const key=serName||ten; if(!key){e++;return}
    let row=DB.series.find(x=>noAcc(x.name)===noAcc(key)&&(!bc||x.brand===bc));
    if(!row){
      const g=NHOMMAP[noAcc(o.nhom)]||["9","MS"];
      row={id:DB.series.length+1,brand:bc||"OEM",name:key,code:autoCode(key),cls:g[0],fam:g[1],
           conf:"thap",old:String(o.nhom||""),exec:[],alias:[]};
      DB.series.push(row); a++;
    } else { if(!row.exec||!row.alias)b++; }
    row.exec=row.exec||[]; row.alias=row.alias||[];
    if(ten&&noAcc(ten)!==noAcc(key)&&row.exec.indexOf(ten)<0){row.exec.push(ten);c++}
    if(sku&&row.alias.indexOf(sku)<0){row.alias.push(sku);d++}
  });
  save(); go("cat"); renderSeries();
  alert(fmt(t("catDone"),{a:a,b:b,c:c,d:d,e:e}));}
function autoCode(nameStr){
  const w=noAcc(nameStr).toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(w.length<=4)return w||"XXXX";
  const cons=w[0]+w.slice(1).replace(/[AEIOU]/g,"");
  return (cons.length>=4?cons:w).slice(0,4);}
function acceptAll(){
  let n=0,k=0;
  document.querySelectorAll("#migOut tbody tr").forEach((tr,i)=>{
    const g=x=>{const el=$("m_"+x+"_"+i);return el?(el.value||"").toUpperCase().trim():""};
    const role=g("role"),cls=g("cls"),fam=g("fam"),brand=g("brand"),ser=g("ser"),size=pad(g("size"),4);
    if(!(role&&cls&&fam&&brand&&ser&&size)){k++;return}
    const code=`${role}${cls}${fam}-${brand}-${ser}-${size}`;
    if(DB.skus.some(s=>s.code===code)){k++;return}
    const nEl=$("m_name_"+i), aEl=$("m_alias_"+i);
    DB.skus.push({code,role,cls,fam,brand,ser,size,child:"",vari:"",rev:"",
      name:nEl?nEl.value:"",alias:aEl?aEl.value:"",status:t("stActive"),
      created:new Date().toISOString().slice(0,10)});n++});
  save(); alert(n?fmt(t("bulkDone"),{n:n,k:k}):t("bulkNone"));}
function runMig(){
  renderMig(($("migIn").value||"").split("\n").filter(x=>x.trim()).map(guess).filter(Boolean));}
function renderMig(res){
  const lvl=c=>c>=75?"cao":c>=45?"vua":"thap";
  $("migOut").innerHTML=`<div class="kpi">${
    [[t("migK")[0],res.length],[t("migK")[1],res.filter(r=>lvl(r.conf)==="cao").length],
     [t("migK")[2],res.filter(r=>lvl(r.conf)==="vua").length],[t("migK")[3],res.filter(r=>lvl(r.conf)==="thap").length]]
    .map(x=>`<div><b>${x[1]}</b><span>${x[0]}</span></div>`).join("")}</div>
    <div class="tbox" style="max-height:none"><table><thead><tr>${t("migCols").map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>
    ${res.map((r,i)=>{
      const full=(r.role&&r.cls&&r.fam&&r.brand&&r.ser&&r.size)?`${r.role}${r.cls}${r.fam}-${r.brand}-${r.ser}-${r.size}`:"";
      const oi=` oninput="migLive(${i})"`;
      return `<tr><td class="mono" style="color:var(--ink-3)">${esc(r.old)}</td>
        <td><input id="m_role_${i}" value="${esc(r.role)}" maxlength="1" style="width:38px"${oi}></td>
        <td><input id="m_cls_${i}" value="${esc(r.cls)}" maxlength="1" style="width:38px"${oi}></td>
        <td><input id="m_fam_${i}" value="${esc(r.fam)}" maxlength="2" style="width:46px"${oi}></td>
        <td><input id="m_brand_${i}" value="${esc(r.brand)}" maxlength="3" style="width:52px"${oi}></td>
        <td><input id="m_ser_${i}" value="${esc(r.ser)}" maxlength="4" style="width:60px"${oi}></td>
        <td><input id="m_size_${i}" value="${esc(r.size)}" maxlength="4" style="width:56px"${oi}></td>
        <td class="c" id="m_out_${i}">${esc(full)||`<span style="color:var(--ink-3)">${t("migMiss")}</span>`}</td>
        <td><span class="pill p-${lvl(r.conf)}">${r.conf}%</span></td>
        <td style="font-size:12px;color:var(--ink-3)">${esc(r.why.join(" · "))}</td>
        <td><input type="hidden" id="m_name_${i}" value="${esc(r.name||"")}"><input type="hidden" id="m_alias_${i}" value="${esc(r.old)}">
        <button class="btn sm" onclick="acceptMig(${i},'${esc(r.old).replace(/'/g,"")}')">${t("accept")}</button></td></tr>`}).join("")}
    </tbody></table></div>
    <div class="toolbar" style="margin:14px 0 0"><button class="btn pri" onclick="acceptAll()">${t("btnAcceptAll")}</button></div>`;}
function migLive(i){
  const g=k=>($("m_"+k+"_"+i).value||"").toUpperCase().trim();
  const role=g("role"),cls=g("cls"),fam=g("fam"),brand=g("brand"),ser=g("ser"),size=pad(g("size"),4);
  const cell=$("m_out_"+i);if(!cell)return;
  if(role&&cls&&fam&&brand&&ser&&size){const code=`${role}${cls}${fam}-${brand}-${ser}-${size}`;
    cell.innerHTML=esc(code)+(DB.skus.some(s=>s.code===code)?` <span class="pill p-thap">${t("migDup")}</span>`:"");}
  else cell.innerHTML=`<span style="color:var(--ink-3)">${t("migMiss")}</span>`;}
function acceptMig(i,old){
  const g=k=>($("m_"+k+"_"+i).value||"").toUpperCase().trim();
  const role=g("role"),cls=g("cls"),fam=g("fam"),brand=g("brand"),ser=g("ser"),size=pad(g("size"),4);
  if(!(role&&cls&&fam&&brand&&ser&&size)){alert(t("migNeed"));return}
  const code=`${role}${cls}${fam}-${brand}-${ser}-${size}`;
  if(DB.skus.some(s=>s.code===code)){alert(code+t("migInLib"));return}
  const nEl=$("m_name_"+i);
  DB.skus.push({code,role,cls,fam,brand,ser,size,child:"",vari:"",rev:"",name:nEl?nEl.value:"",alias:old,
    status:t("stActive"),created:new Date().toISOString().slice(0,10)});
  save();alert(t("migAdded")+code);}

/* ---------- xuất / nhập ---------- */
function dl(text,name,mime){const b=new Blob([text],{type:mime+";charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);}
function doExport(){dl(JSON.stringify(DB,null,1),"dhp-coding-v4-"+new Date().toISOString().slice(0,10)+".json","application/json")}
function doImport(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.skus||!d.series)throw 0;
    DB=d;save();applyLang();go("lib");alert(fmt(t("impOk"),{n:DB.skus.length}))}
    catch(e){alert(t("impBad"))}};
  r.readAsText(f);inp.value="";}

/* ---------- khởi động ---------- */
function initSelects(keep){
  const k=keep?{r:$("b_role").value,c:$("b_cls").value,f:$("b_fam").value,b:$("b_brand").value,s:$("b_ser").value,
                ch:$("b_child").value,pt:$("p_type").value,fc:$("fCls").value,fb:$("fBrand").value,cb:$("cBrand").value}:null;
  opt($("b_role"),ROLES.map(r=>[r[0],r[li()]]),k?k.r:"0");
  opt($("b_cls"),CLASSES.map(c=>[c[0],c[li()]]),k?k.c:"1"); famList(); if(k&&k.f)$("b_fam").value=k.f;
  const bl=DB.brands.map(b=>[b.code,b.name]);
  opt($("b_brand"),bl,k?k.b:"KTR"); serList(); if(k&&k.s)$("b_ser").value=k.s;
  opt($("b_child"),CHILD.map(c=>[c[0],c[li()]]),k?k.ch:"");
  opt($("fCls"),CLASSES.map(c=>[c[0],c[li()]]),k?k.fc:"",t("allCls"));
  opt($("fBrand"),bl,k?k.fb:"",t("allBrand"));
  opt($("cBrand"),bl,k?k.cb:"",t("allBrand"));
  opt($("p_type"),JOBTYPE.map(j=>[j[0],j[li()]]),k?k.pt:"P");
  if(!keep)$("p_seq").value="001";}
load(); initTabs(); initSelects(false); applyLang();
